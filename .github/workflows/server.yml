name: Deploy scoring server

# Puts the Awwbum Plus scoring server (server/) on Cloudflare Workers. Run it from the Actions tab.
# Needs three repository secrets, added by the owner (never stored in the repo):
#   CLOUDFLARE_API_TOKEN   - Cloudflare API token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  - shown on the Cloudflare dashboard (Workers & Pages, right side)
#   ANTHROPIC_API_KEY      - the Anthropic key the server uses for Claude (a new key just for the server)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the three secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANTHROPIC_API_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Add the repository secret $v (Settings > Secrets and variables > Actions)."; missing=1; fi
          done
          exit $missing

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Usage counter (created once, reused after)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          find_id() {
            npx wrangler kv namespace list 2>kvlist.err | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                const i = s.indexOf("["); if (i < 0) return;
                const list = JSON.parse(s.slice(i));
                const n = list.find(x => x.title === "awwbum-QUOTA");
                if (n) process.stdout.write(n.id);
              });'
          }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx wrangler kv namespace create awwbum-QUOTA
            ID=$(find_id)
          fi
          if [ -z "$ID" ]; then cat kvlist.err; echo "::error::Couldn't create or find the awwbum-QUOTA storage. Check the API token's permissions."; exit 1; fi
          sed -i "s/PASTE_YOUR_KV_NAMESPACE_ID_HERE/$ID/" wrangler.toml
          echo "Using usage counter $ID"

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then
            echo "::error::Deploy finished but printed no workers.dev address. If the log above mentions a workers.dev subdomain, open Workers & Pages in the Cloudflare dashboard once to pick one, then run this again."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Give the server the Anthropic key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY

      - name: Check it's live
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for i in $(seq 1 18); do
            code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' "$URL/v1/quota" || true)
            # No subscription sent, so a live server answers 401 (not subscribed).
            if [ "$code" = "401" ]; then echo "::notice::Scoring server is live at $URL"; exit 0; fi
            sleep 10
          done
          echo "::error::The server didn't answer as expected at $URL (last status $code)."
          exit 1
