name: iOS

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload a build to TestFlight"
        type: boolean
        default: false
      runner:
        description: "Mac to build on (Apple silicon is much faster; Intel if Apple silicon is out of capacity)"
        type: choice
        options: [macos-15-intel, macos-15]
        default: macos-15-intel

# A newer run replaces an older one that's still going (no more piling up).
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The privacy guards run first, on a quick Linux machine; nothing is built or uploaded unless they pass.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read-only guard (the only change allowed in the photo library is a favorite)
        run: |
          PAT='performChanges|PHAssetChangeRequest|PHAssetCreationRequest|PHAssetCollectionChangeRequest|PHCollectionListChangeRequest|deleteAssets|UIImageWriteToSavedPhotosAlbum|UISaveVideoAtPathToSavedPhotosAlbum|PHContentEditingOutput|ShareLink|NSPhotoLibraryAddUsageDescription'
          # One exception, allowed by the owner: Model/Favorites.swift may set a photo's favorite, and nothing else.
          F=AwwList/Model/Favorites.swift
          SRC=$(git ls-files '*.swift' '*.m' '*.h' '*.plist' '*.yml' | grep -v '^\.github/')
          if grep -nE "$PAT" $SRC | grep -vF "$F:"; then echo "::error::Photo-library write API found. Aww List must stay read-only (favorites only, in $F)."; exit 1; fi
          # No way around it by name: no runtime class or selector lookups, no key-value writes.
          if grep -nE 'NSClassFromString|NSSelectorFromString|dlsym|dlopen|setValue\([^)]*forKey:|class_getInstanceMethod|objc_msgSend' $SRC; then echo "::error::Dynamic calls aren't allowed (they could reach photo-library write APIs)."; exit 1; fi
          # In Favorites.swift every change line must be exactly "<asset change request>(for: x).isFavorite = y".
          if grep -nE 'ChangeRequest|CreationRequest|perform\(|deleteAssets|ContentEditing' "$F" | grep -vE 'PHAssetChangeRequest\(for: [A-Za-z]+\)\.isFavorite = [A-Za-z]+$|PHPhotoLibrary\.shared\(\)\.performChanges \{$'; then echo "::error::$F may only set isFavorite."; exit 1; fi
          [ "$(grep -c 'performChanges' "$F")" -le 1 ] || { echo "::error::$F may make only one kind of change."; exit 1; }
          grep -qE '^[[:space:]]*vc\.excludedActivityTypes = \[\.saveToCameraRoll, .*StreamShareService' AwwList/Views/ViewerView.swift || { echo "::error::The share sheet must keep excluding Save Image and Shared Album."; exit 1; }
          # Never look in the Hidden album.
          if grep -nE "includeHiddenAssets *= *[^f ]|isHidden|hiddenAlbum|smartAlbumAllHidden|AllHidden|withLocalIdentifiers|withBurstIdentifier|forKey: *\"includeHiddenAssets" $SRC; then echo "::error::The app must never look in the Hidden album."; exit 1; fi
          echo "No photo-library writes (other than favorites) and no Hidden-album access found."

  # Tests and the TestFlight build run side by side once the guards pass.
  build-and-test:
    needs: guard
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26 (App Store uploads need the iOS 26 SDK)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build and run unit tests (simulator, no signing)
        shell: bash
        run: |
          set -o pipefail
          gem list -i xcpretty >/dev/null || gem install xcpretty --no-document
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          xcodebuild test \
            -project AwwList.xcodeproj -scheme AwwList \
            -destination "id=$SIM" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | xcpretty
      - name: Show compile errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -20 | while read -r l; do echo "::error::$l"; done || true

  testflight:
    needs: guard
    if: inputs.testflight
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 120
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      AWW_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AWW_BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26 (App Store uploads need the iOS 26 SDK)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build, sign and upload to TestFlight
        shell: bash
        run: |
          set -o pipefail
          fastlane beta 2>&1 | tee fastlane.log
      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          # The full log can't be downloaded from where this is maintained, so the key lines become annotations.
          { cat ~/Library/Logs/gym/*.log 2>/dev/null | grep -E "error:" | sort -u | head -8
            grep -E "\[!\]|ERROR|Error|error:|Could not|maximum|limit" fastlane.log | grep -v "^\s*$" | tail -8; } \
            | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-400 | while read -r l; do echo "::error::$l"; done || true
