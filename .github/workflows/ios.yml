name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload a build to TestFlight"
        type: boolean
        default: false

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26 (App Store uploads need the iOS 26 SDK)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build and run unit tests (simulator, no signing)
        shell: bash
        run: |
          set -o pipefail
          gem list -i xcpretty >/dev/null || gem install xcpretty --no-document
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          xcodebuild test \
            -project AwwList.xcodeproj -scheme AwwList \
            -destination "id=$SIM" \
            CODE_SIGNING_ALLOWED=NO | xcpretty

  testflight:
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      AWW_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AWW_BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26 (App Store uploads need the iOS 26 SDK)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build, sign and upload to TestFlight
        run: fastlane beta
