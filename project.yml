name: AwwList
options:
  bundleIdPrefix: com.awwlist
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    VERSIONING_SYSTEM: apple-generic
    AWW_BUNDLE_ID: com.awwlist.app
    AWW_TEAM_ID: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "$(AWW_TEAM_ID)"
targets:
  AwwList:
    type: application
    platform: iOS
    sources:
      - path: AwwList
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(AWW_BUNDLE_ID)"
        INFOPLIST_FILE: AwwList/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  AwwListTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AwwListTests
    dependencies:
      - target: AwwList
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(AWW_BUNDLE_ID).tests"
schemes:
  AwwList:
    build:
      targets:
        AwwList: all
    test:
      targets:
        - AwwListTests
